name: ai_salomatlik
description: AI Salomatlik - sun'iy intellekt asosidagi parhez va fitness kouching ilovasi
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests to Django REST backend
  http: ^1.2.0

  # Local key-value storage for non-sensitive preferences
  shared_preferences: ^2.2.0

  # State management
  provider: ^6.1.0

  # Date and number formatting
  intl: ^0.19.0

  # Secure token storage (Keychain on iOS, EncryptedSharedPreferences on Android)
  flutter_secure_storage: ^9.0.0

  # Material icons
  cupertino_icons: ^1.0.6

  # Camera / gallery image capture for food-photo calorie logging
  image_picker: ^1.1.0

  # Firebase Cloud Messaging — push reminders (water / meals)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local notifications — display FCM pushes in foreground + notification channel
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Generates Android/iOS launcher icons from a single source image
  flutter_launcher_icons: ^0.14.1

# App launcher icon configuration (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  # Adaptive icon for Android 8+ (white card background matches the logo)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
