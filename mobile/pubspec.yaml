name: ai_salomatlik
description: AI Salomatlik - sun'iy intellekt asosidagi parhez va fitness kouching ilovasi
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests to Django REST backend
  http: ^1.2.0

  # Local key-value storage for non-sensitive preferences
  shared_preferences: ^2.2.0

  # State management
  provider: ^6.1.0

  # Date and number formatting
  intl: ^0.19.0

  # Secure token storage (Keychain on iOS, EncryptedSharedPreferences on Android)
  flutter_secure_storage: ^9.0.0

  # Material icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Uncomment to add assets:
  # assets:
  #   - assets/images/
